# Hardened application overlay. Infrastructure still comes from docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires a populated .env with non-placeholder secrets and licence signing keys.
# The API refuses to start in SPRING_PROFILES_ACTIVE=prod otherwise.

services:
  api:
    build:
      context: ./services/api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      API_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ciphermarket}
      POSTGRES_USER: ${POSTGRES_USER:-ciphermarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ciphermarket}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-ciphermarket}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ciphermarket}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-ciphermarket-dek}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8180}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ciphermarket}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      LICENCE_SIGNING_PRIVATE_KEY: ${LICENCE_SIGNING_PRIVATE_KEY}
      LICENCE_SIGNING_PUBLIC_KEY: ${LICENCE_SIGNING_PUBLIC_KEY}
      HSTS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ciphermarket-api
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-ciphermarket}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-ciphermarket-web}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
