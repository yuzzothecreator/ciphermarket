spring:
  application:
    name: ciphermarket-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ciphermarket}
    username: ${POSTGRES_USER:ciphermarket}
    password: ${POSTGRES_PASSWORD:change_me_in_local_env}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me_in_local_env}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ciphermarket}
    password: ${RABBITMQ_PASSWORD:change_me_in_local_env}
    virtual-host: ${RABBITMQ_VHOST:ciphermarket}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ciphermarket}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ciphermarket}/protocol/openid-connect/certs
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${API_PORT:8080}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,readiness
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

ciphermarket:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    hsts-enabled: ${HSTS_ENABLED:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:120}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  keycloak:
    realm: ${KEYCLOAK_REALM:ciphermarket}
  vault:
    address: ${VAULT_ADDR:http://localhost:8200}
    token: ${VAULT_TOKEN:dev-only-token}
    transit-key: ${VAULT_TRANSIT_KEY:ciphermarket-dek}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:ciphermarket}
    secret-key: ${MINIO_ROOT_PASSWORD:change_me_in_local_env}
    bucket-quarantine: ${MINIO_BUCKET_QUARANTINE:ciphermarket-quarantine}
    bucket-protected: ${MINIO_BUCKET_PROTECTED:ciphermarket-protected}
  upload:
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE:524288000}
    session-ttl-minutes: ${UPLOAD_SESSION_TTL:30}
    allowed-extensions:
      - pdf
      - zip
      - png
      - jpg
      - jpeg
      - svg
      - psd
      - ai
      - eps
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    enabled: ${CLAMAV_ENABLED:true}
  messaging:
    upload-queue: ciphermarket.upload.processing
    upload-dlq: ciphermarket.upload.processing.dlq
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-dev-webhook-secret-change-me}
    mock-provider-name: MOCK
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
  delivery:
    grant-ttl-minutes: ${DELIVERY_GRANT_TTL_MINUTES:15}
    max-uses-per-grant: ${DELIVERY_MAX_USES_PER_GRANT:3}
    licence-validity-days: ${DELIVERY_LICENCE_VALIDITY_DAYS:365}
    require-device-registration: ${DELIVERY_REQUIRE_DEVICE:false}
  licence:
    signing-private-key-base64: ${LICENCE_SIGNING_PRIVATE_KEY:}
    signing-public-key-base64: ${LICENCE_SIGNING_PUBLIC_KEY:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.ciphermarket: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

info:
  app:
    name: CipherMarket API
    description: Zero-trust marketplace backend
    version: 0.1.0
