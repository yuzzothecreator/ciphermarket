spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

ciphermarket:
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    com.ciphermarket: INFO
